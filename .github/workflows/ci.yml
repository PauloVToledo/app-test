name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api-contract:
    name: API contract tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskflow_ci
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: ci-postgres-password
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_DB: taskflow_ci
      POSTGRES_USER: taskflow
      JWT_SECRET_FILE: ${{ github.workspace }}/.ci/jwt_secret
      POSTGRES_PASSWORD_FILE: ${{ github.workspace }}/.ci/postgres_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Create ephemeral test secrets
        run: |
          mkdir -p .ci
          printf '%s' 'ci-jwt-secret-that-is-longer-than-thirty-two-characters' > .ci/jwt_secret
          printf '%s' 'ci-postgres-password' > .ci/postgres_password
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run API contract tests
        working-directory: backend
        run: python -m unittest discover -v -s tests

  compose-smoke:
    name: Docker Compose startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create CI configuration and ephemeral secrets
        run: |
          cp .env.example .env
          sed -i 's/^TASKFLOW_DOMAIN=.*/TASKFLOW_DOMAIN=localhost/' .env
          mkdir -p secrets
          printf '%s' 'ci-jwt-secret-that-is-longer-than-thirty-two-characters' > secrets/jwt_secret
          printf '%s' 'ci-postgres-password' > secrets/postgres_password
          printf '%s' 'ci-grafana-password-that-is-longer-than-thirty-two' > secrets/grafana_admin_password
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Build and start application services
        run: docker compose up --build --wait
      - name: Confirm public entrypoint started
        run: docker compose ps --status running --services | grep -qx caddy
      - name: Show service status on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color
      - name: Remove ephemeral services and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
