server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Sonda usada por Docker y por las alertas de disponibilidad.
    location = /healthz {
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # Cache agresiva para assets con hash (Vite genera hashes de contenido)
    location ~* \.(js|css|woff2|woff|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API FastAPI
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Caddy ya saneó estos valores. No anexar X-Forwarded-For evita que
        # una cadena pública manipulada llegue a FastAPI.
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        # Encabezado privado: FastAPI sólo lo acepta desde esta red interna.
        proxy_set_header X-TaskFlow-Client-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
