services:
  backend:
    build: ./backend
    restart: unless-stopped
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      JWT_SECRET_FILE: /run/secrets/taskflow_jwt_secret
      POSTGRES_PASSWORD_FILE: /run/secrets/taskflow_postgres_password
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.31.0.0/24}
    volumes:
      # Fuente heredada de una sola lectura para migrar SQLite/JSON a PostgreSQL.
      # El servicio ya no escribe datos de aplicación en el sistema de archivos.
      - ./backend/data:/legacy-data:ro
    secrets:
      - taskflow_jwt_secret
      - taskflow_postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_internal
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/api/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD_FILE: /run/secrets/taskflow_postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - taskflow_postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_internal

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Nginx escucha IPv4 por defecto; evitar que localhost resuelva a ::1.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - edge
      - app_internal

  # Única entrada pública: Caddy obtiene y renueva el certificado ACME y
  # redirige automáticamente las peticiones HTTP a HTTPS.
  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Debe ser el FQDN público. Docker Compose falla explícitamente si falta
      # para evitar solicitar certificados para un dominio accidental.
      TASKFLOW_DOMAIN: ${TASKFLOW_DOMAIN:?Define TASKFLOW_DOMAIN en .env}
    volumes:
      - ./infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - edge

  # Observabilidad local: no se publica a Internet. Grafana queda limitado al
  # loopback del host y Alloy sólo puede leer el socket Docker.
  loki:
    image: grafana/loki:3.3.2@sha256:8af2de1abbdd7aa92b27c9bcc96f0f4140c9096b507c77921ffddf1c6ad6c48f
    profiles: ["observability"]
    restart: unless-stopped
    logging: *default-logging
    command: -config.file=/etc/loki/config.yml
    expose:
      - "3100"
    volumes:
      - ./infra/monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki

  alloy:
    image: grafana/alloy:v1.7.4@sha256:fd2d274beeed926ffe62cf353df12a69d37af61e9a27eb4dc897a127755e4d95
    profiles: ["observability"]
    restart: unless-stopped
    logging: *default-logging
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    volumes:
      - ./infra/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started

  grafana:
    image: grafana/grafana:11.5.2@sha256:8b37a2f028f164ce7b9889e1765b9d6ee23fec80f871d156fbf436d6198d32b7
    profiles: ["observability"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3333:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/taskflow_grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    secrets:
      - taskflow_grafana_admin_password
    depends_on:
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  loki_data:
  grafana_data:

networks:
  # Sólo Caddy y Nginx comparten la red de entrada. La API y PostgreSQL no
  # tienen ruta directa desde el host ni desde Caddy.
  edge:
    driver: bridge
  app_internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24

secrets:
  taskflow_jwt_secret:
    file: ./secrets/jwt_secret
  taskflow_postgres_password:
    file: ./secrets/postgres_password
  taskflow_grafana_admin_password:
    file: ./secrets/grafana_admin_password
