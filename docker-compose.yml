services:
  backend:
    build: ./backend
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      JWT_SECRET_FILE: /run/secrets/taskflow_jwt_secret
      POSTGRES_PASSWORD_FILE: /run/secrets/taskflow_postgres_password
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
    volumes:
      - ./backend/data:/app/data
    secrets:
      - taskflow_jwt_secret
      - taskflow_postgres_password
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD_FILE: /run/secrets/taskflow_postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - taskflow_postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: .
    expose:
      - "80"
    depends_on:
      - backend

  # Única entrada pública: Caddy obtiene y renueva el certificado ACME y
  # redirige automáticamente las peticiones HTTP a HTTPS.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Debe ser el FQDN público. Docker Compose falla explícitamente si falta
      # para evitar solicitar certificados para un dominio accidental.
      TASKFLOW_DOMAIN: ${TASKFLOW_DOMAIN:?Define TASKFLOW_DOMAIN en .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
  postgres_data:

secrets:
  taskflow_jwt_secret:
    file: ./secrets/jwt_secret
  taskflow_postgres_password:
    file: ./secrets/postgres_password
